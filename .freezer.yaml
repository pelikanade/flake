# A nixosConfigurations attribute is not a derivation, so it must be named down
# to the system closure. A glob is only allowed in the final component, so every
# machine in use is listed explicitly and a new one must be added here.
entries:
  - packages.x86_64-linux.*
  - nixosConfigurations.asymmetry.config.system.build.toplevel
  - nixosConfigurations.edge.config.system.build.toplevel
  - nixosConfigurations.neko-sphere.config.system.build.toplevel
  - nixosConfigurations.parallax.config.system.build.toplevel
