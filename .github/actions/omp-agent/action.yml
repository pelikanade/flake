name: omp agent
description: >-
  Run an omp agent unattended, streaming its thinking into the job log.
author: pelikanade

branding:
  icon: terminal
  color: purple

inputs:
  prompt:
    description: The agent's prompt, as text.
    required: true
  model:
    description: Model to run; empty uses omp's own default.
    default: ''
  omp:
    description: omp binary; empty uses $OMP_AGENT_BIN, then omp on PATH.
    default: ''
  cwd:
    description: Directory the agent works in; empty uses the job's working directory.
    default: ''
  skills:
    description: >-
      Skills to install with `omp skill install` before the agent starts, in
      that command's spec format (@scope/name[@version]); whitespace separated.
    default: ''
  max-time:
    description: omp's own session limit.
    default: 45m
  timeout:
    description: >-
      Seconds after which the agent and the tools it started are killed (exit
      124). Keep it above max-time: it is the backstop for a hung omp.
    default: '3600'
  approval-mode:
    description: Approval mode to pass to omp; an unattended step cannot answer prompts.
    default: yolo
  thoughts:
    description: Include thinking blocks in the job log (omp drops them without this).
    default: 'true'
  extra-args:
    description: Extra arguments appended to the omp command, split on spaces.
    default: ''

outputs:
  exit-code:
    description: >-
      The agent's exit status: 124 when the timeout killed it, 127 when it never
      started.
    value: ${{ steps.agent.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: agent
      shell: bash
      env:
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OMP: ${{ inputs.omp }}
        INPUT_CWD: ${{ inputs.cwd }}
        INPUT_SKILLS: ${{ inputs.skills }}
        INPUT_MAX_TIME: ${{ inputs.max-time }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_APPROVAL_MODE: ${{ inputs.approval-mode }}
        INPUT_THOUGHTS: ${{ inputs.thoughts }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "$GITHUB_ACTION_PATH/action.sh"
