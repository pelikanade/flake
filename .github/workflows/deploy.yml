name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # A dispatch from any other ref must not activate this repository's
    # configuration on the servers.
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - neko-sphere
    timeout-minutes: 240
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build deploy targets
        run: /run/current-system/sw/bin/nixos-deploy-build

      # Remote targets first; the runner's own host is deployed last by the
      # request wrapper.
      - name: Deploy all targets
        run: /run/current-system/sw/bin/nixos-deploy-request all
