name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # A dispatch from any other ref must not activate this repository's
    # configuration on the servers.
    if: github.ref == 'refs/heads/main'
    name: Deploy ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with the machines that import deploy-target.
        target:
          - edge
          - neko-sphere
    runs-on:
      - self-hosted
      - neko-sphere
    timeout-minutes: 240
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and trigger deploy target
        run: /run/current-system/sw/bin/avalanche-client --target "${{ matrix.target }}"