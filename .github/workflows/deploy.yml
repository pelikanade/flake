name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - edge
          - neko-sphere
    runs-on:
      - self-hosted
      - avalanche
    timeout-minutes: 240
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and trigger deploy target
        env:
          AVALANCHE_CLIENT_TAILNET: dwelf-hoki.ts.net
          AVALANCHE_CLIENT_PORT: "28250"
          AVALANCHE_CLIENT_FLAKE: "."
          AVALANCHE_CLIENT_TIMEOUT: 2h
        run: /run/current-system/sw/bin/avalanche-client --target "${{ matrix.target }}"
