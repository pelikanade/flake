name: Package PR

# Update PRs are the only ones that opt into this gate. They are opened by the
# repair workflow on an `update/` branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: package-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      startsWith(github.head_ref, 'update/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31

      # Builds the packages whose files changed, plus each package's declared
      # `verify` targets. The repair agent's local build is not this gate.
      - name: Build changed packages
        run: >-
          python3 scripts/verify-packages.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --log-dir .ci

      - name: Upload build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-build
          path: .ci/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  review:
    needs: build
    if: >-
      startsWith(github.head_ref, 'update/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@v4
        with:
          name: pr-build
          path: .ci

      # A second, independent omp agent reviews the diff and the build result.
      # It may reject; the publish step below never merges a rejection.
      - name: Review the repair
        id: review
        continue-on-error: true
        env:
          OMP_REVIEW_MODEL: ${{ vars.OMP_REVIEW_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          omp=$(nix build --no-link --print-out-paths .#omp)
          python3 scripts/review-updates.py \
            --log-dir .review \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --omp "$omp/bin/omp"

      - name: Publish review and merge
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          verdict=.review/verdict.json

          if [ -f .review/review.md ]; then
            gh pr comment "$pr" --body-file .review/review.md
          elif [ -f "$verdict" ]; then
            gh pr comment "$pr" --body "$(jq -r '.summary' "$verdict")"
          fi

          if [ "${{ steps.review.outcome }}" != "success" ]; then
            echo "::error::the review step did not complete"
            exit 1
          fi
          if [ ! -f "$verdict" ] || [ "$(jq -r '.approve' "$verdict")" != "true" ]; then
            echo "::error::the review agent did not approve this PR"
            exit 1
          fi
          if [ "$(jq '.security_findings // [] | length' "$verdict")" -ne 0 ]; then
            echo "::error::the review reported security findings; not merging"
            exit 1
          fi
          if [ "$(gh pr view "$pr" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "::error::the PR is a draft; not merging"
            exit 1
          fi

          # Queue the merge so this workflow's own check can finish. If the
          # repository has no auto-merge, try a direct merge under the token's
          # permissions.
          if ! gh pr merge "$pr" --auto --rebase --delete-branch; then
            gh pr merge "$pr" --rebase --delete-branch
          fi

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review
          path: .review/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Report
        if: always()
        run: |
          {
            echo "## Package PR review"
            echo
            if [ -f .review/review.md ]; then
              cat .review/review.md
            elif [ -f .review/verdict.json ]; then
              jq -r '.summary' .review/verdict.json
            else
              echo "The review agent produced no verdict."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -f .review/verdict.json ] ||
            [ "$(jq -r '.approve' .review/verdict.json)" != "true" ]; then
            echo "::error::the review did not approve this PR"
            exit 1
          fi
          if [ "$(jq '.security_findings // [] | length' .review/verdict.json)" -ne 0 ]; then
            echo "::error::the review reported security findings"
            exit 1
          fi
