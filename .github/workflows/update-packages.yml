name: Update packages

on:
  schedule:
    # 02:00 in Asia/Shanghai. GitHub cron is UTC. The deploy workflow follows
    # the push immediately.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-packages
  cancel-in-progress: false

# One step per phase: update flake inputs, update packages, build them, repair
# the failed updates, review the repairs, push, dispatch the deployment, and
# report. The two agent phases run as three steps each — prepare, the agent,
# and verify — so the agent is visible on its own in the run graph.
#
# Each phase decides its own outcome in its verify step and publishes it as
# step outputs: `gate` names the phase that rejected the run, `clean-tip` is
# the commit a rejected run resets to so the clean updates still land, and `ok`
# means the phase verified everything it owns — a run with no `ok` is never
# published.
#
# The agent runtime is `.github/actions/omp-agent`, a vendored copy of the
# `omp-agent` repository; see its VENDORED.md for the one-line change that
# replaces it once that repository is published.
jobs:
  update:
    # This runner, its Nix, omp and its Magpie configuration are defined by
    # modules/services/github-runners/update-packages-runner.nix. It is a
    # separate label from the deploy runner so an update cannot occupy the
    # deploy queue.
    runs-on:
      - self-hosted
      - update-packages
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          # The agents run before the final push and have no git credentials.
          persist-credentials: false
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1. Flake inputs. This evaluates every machine toplevel; it does not
      # build them.
      - name: Update flake inputs
        run: ./scripts/update-packages.py --build --commit flake

      # 2. Package updates. Every package is updated and built before a pin is
      # eligible to commit. `--keep-failed` leaves the pins that fail in the
      # working tree and writes updates.json/failures.json; without --commit
      # nothing is committed yet.
      - name: Update packages
        id: packages
        run: ./scripts/update-packages.py --keep-failed --log-dir=.update-agent

      # 3. Build every updated package and commit what may be committed: the
      # pins whose build passed, then the pins that need repair. A build
      # failure is a repair, not an error. This phase publishes clean-tip, the
      # gate when the build did not complete or an update command failed, and
      # ok when nothing needs repair or review.
      - name: Build updated packages
        id: build
        if: steps.packages.outcome == 'success'
        run: |
          if [ -f .update-agent/updates.json ]; then
            python3 scripts/verify-packages.py \
              --updates .update-agent/updates.json \
              --log-dir .ci || true
          else
            echo "no package updates to build"
          fi
          python3 scripts/commit-updates.py --phase clean
          python3 scripts/commit-updates.py --phase failed

      # 4. Repair failed updates: the prompt, the agent, then the verification.
      - name: Prepare the repair
        id: repair-prompt
        if: >-
          steps.build.outcome == 'success' &&
          steps.build.outputs.gate == '' &&
          steps.build.outputs.ok == ''
        run: python3 scripts/repair-updates.py --mode prepare --log-dir .update-agent

      - name: Repair failed updates
        id: repair-agent
        if: steps.repair-prompt.outputs.needs-repair == 'true'
        uses: ./.github/actions/omp-agent
        continue-on-error: true
        with:
          prompt: ${{ steps.repair-prompt.outputs.prompt }}
          model: ${{ vars.OMP_MODEL || 'magpie/deepseek/deepseek-flash' }}
          log: .update-agent/logs/omp.log
          cwd: ${{ github.workspace }}
          session-dir: .update-agent/omp-sessions
          max-time: 45m
          timeout: '3600'

      # The repair phase's gates: the agent must have left every package
      # building, must not have reached outside modules/packages, and the final
      # build of every updated package, which the reviewer reads, must pass.
      # A repair that changed nothing leaves nothing to review, so it is `ok`.
      - name: Verify the repair
        id: repair
        if: always() && steps.repair-prompt.outputs.needs-repair == 'true'
        env:
          AGENT_EXIT: ${{ steps.repair-agent.outputs.exit-code }}
        run: >-
          python3 scripts/repair-updates.py --mode verify --log-dir .update-agent
          --agent-exit "$AGENT_EXIT"

      # 5. Review changes: the prompt, the second agent, then the verification.
      - name: Prepare the review
        id: review-prompt
        if: >-
          always() && steps.repair.outcome == 'success' &&
          steps.repair.outputs.gate == ''
        run: >-
          python3 scripts/review-updates.py --mode prepare --log-dir .review
          --base "${{ steps.build.outputs.clean-tip }}"

      - name: Review changes
        id: review-agent
        if: steps.review-prompt.outputs.needs-review == 'true'
        uses: ./.github/actions/omp-agent
        continue-on-error: true
        with:
          prompt: ${{ steps.review-prompt.outputs.prompt }}
          model: ${{ vars.OMP_REVIEW_MODEL || 'magpie/deepseek/deepseek-flash' }}
          log: .review/omp.log
          cwd: ${{ github.workspace }}
          session-dir: .review/omp-sessions
          max-time: 20m
          timeout: '1800'

      # The reviewer approves with an empty `security_findings` and without
      # touching the working tree; anything else is the gate. `ok` here is what
      # lets the push commit the repair.
      - name: Verify the review
        id: review
        if: always() && steps.review-prompt.outputs.needs-review == 'true'
        env:
          AGENT_EXIT: ${{ steps.review-agent.outputs.exit-code }}
        run: >-
          python3 scripts/review-updates.py --mode verify --log-dir .review
          --agent-exit "$AGENT_EXIT"

      # 6. Without ok, or with a gate, reset to clean-tip: the failed pins and
      # the repairs are dropped, but the clean update commits still land.
      - name: Push updates
        id: push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_TIP: ${{ steps.build.outputs.clean-tip }}
          GATE: ${{ steps.build.outputs.gate || steps.repair.outputs.gate || steps.review.outputs.gate }}
          OK: ${{ steps.build.outputs.ok || steps.repair.outputs.ok || steps.review.outputs.ok }}
        run: |
          set -euo pipefail
          if [ -z "$CLEAN_TIP" ]; then
            echo "::error::the update did not reach the commit phase"
            exit 1
          fi

          verified=true
          if [ -n "$GATE" ] || [ -z "$OK" ]; then
            verified=false
          elif ! python3 scripts/commit-updates.py --phase repair; then
            GATE=repair
            verified=false
          fi
          if [ "$verified" != true ]; then
            echo "::error::verification did not finish (${GATE:-unverified}); dropping unverified pins"
            git reset --hard "$CLEAN_TIP"
          fi
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to push"
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          [ "$verified" = true ]

      # 7. A push made with GITHUB_TOKEN does not trigger a `push` workflow.
      # Dispatch the deploy for the revision that was just pushed.
      - name: Dispatch deployment
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Upload update artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-agent
          path: |
            .update-agent/
            .ci/
            .review/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # 8. Report.
      - name: Report
        if: always()
        env:
          GATE: ${{ steps.push.outputs.gate }}
        run: |
          {
            echo "## Package update"
            echo
            if [ -f .update-agent/updates.json ]; then
              jq -r '.[] | "- \(.label): \(.old) -> \(.new)\(if .failed then " (repair)" else "" end)"' \
                .update-agent/updates.json
            else
              echo "No package changed."
            fi
            if [ -f .update-agent/report-body.md ]; then
              echo
              cat .update-agent/report-body.md
            fi
            if [ -f .review/review.md ]; then
              echo
              cat .review/review.md
            fi
            if [ -n "$GATE" ]; then
              echo
              echo "Gate: **$GATE**. Unverified pins were dropped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
