name: Update packages

on:
  schedule:
    # 02:00 in Asia/Shanghai. GitHub cron is UTC. The deploy workflow follows
    # the push immediately.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    # This runner, its Nix and its tools are defined by
    # modules/services/runners/update-packages-runner.nix. It is a separate
    # label from the deploy runner so an update cannot occupy the deploy queue.
    runs-on:
      - self-hosted
      - update-packages
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          # The agents run before the final push and have no git credentials.
          persist-credentials: false
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1. Flake inputs. This evaluates every machine toplevel; it does not
      # build them.
      - name: Update flake inputs
        run: ./scripts/update-packages.py --build --commit flake

      # 2. Package updates. Every package is updated and built before a pin is
      # eligible to commit. `--keep-failed` leaves the pins that fail in the
      # working tree and writes updates.json/failures.json; without --commit
      # nothing is committed yet.
      - name: Update packages
        id: packages
        continue-on-error: true
        run: ./scripts/update-packages.py --keep-failed --log-dir=.update-agent

      - name: Stop on a fatal updater failure
        if: steps.packages.outcome == 'failure'
        run: |
          echo "::error::the updater failed before it could defer package repairs"
          exit 1

      # 3. Build every updated package. This is the single build phase; a
      # package build failure is written to failures.json and updates.json.
      - name: Build updated packages
        id: build
        if: steps.packages.outcome == 'success'
        continue-on-error: true
        run: |
          if [ ! -f .update-agent/updates.json ]; then
            echo "no package updates to build"
            exit 0
          fi
          python3 scripts/verify-packages.py \
            --updates .update-agent/updates.json \
            --log-dir .ci

      # The clean pins become separate commits first. clean-tip is the commit
      # we return to if repair or review does not pass. Nothing is committed if
      # the build phase did not complete (for example, a discovery error).
      - name: Commit clean updates
        if: steps.packages.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -f .update-agent/failures.json ] &&
            [ ! -f .update-agent/updates.json ]; then
            echo "::error::failed updates have no update manifest"
            echo repair > .update-agent/gate
            git rev-parse HEAD > .update-agent/clean-tip
            exit 0
          fi
          if [ -f .update-agent/updates.json ] &&
            [ ! -f .ci/build-summary.json ]; then
            echo "::error::the build phase did not complete"
            echo build > .update-agent/gate
            git rev-parse HEAD > .update-agent/clean-tip
            exit 0
          fi
          update_failures=0
          if [ -f .update-agent/failures.json ]; then
            update_failures=$(jq \
              '[.[] | select(.phase == "update")] | length' \
              .update-agent/failures.json)
            if [ "$update_failures" -gt 0 ]; then
              echo "::error::$update_failures update command(s) failed; dropping their pins"
              echo update > .update-agent/gate
            fi
          fi
          blocking=0
          if [ -f .update-agent/blocking.json ]; then
            blocking=$(jq 'length' .update-agent/blocking.json)
            if [ "$blocking" -gt 0 ]; then
              echo "::error::$blocking package(s) could not be updated"
              echo update > .update-agent/gate
            fi
          fi
          if [ -f .update-agent/updates.json ]; then
            python3 scripts/commit-updates.py --phase clean \
              --report .update-agent/updates.json
          fi
          git rev-parse HEAD > .update-agent/clean-tip
          if [ "$update_failures" -eq 0 ] &&
            [ "$blocking" -eq 0 ] &&
            [ ! -f .update-agent/failures.json ]; then
            touch .update-agent/ok
          fi

      # The failing pins are committed separately. They stay local until the
      # repair and review gates pass; a failure resets to clean-tip.
      - name: Commit pins needing repair
        if: >-
          steps.packages.outcome == 'success' &&
          hashFiles('.update-agent/failures.json') != '' &&
          hashFiles('.update-agent/gate') == ''
        run: |
          python3 scripts/commit-updates.py --phase failed \
            --report .update-agent/updates.json

      # 4. If a package failed to build, one agent adapts the local patches.
      - name: Repair failed updates
        id: repair
        if: >-
          steps.packages.outcome == 'success' &&
          hashFiles('.update-agent/failures.json') != '' &&
          hashFiles('.update-agent/gate') == ''
        continue-on-error: true
        env:
          OMP_MODEL: ${{ vars.OMP_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/repair-updates.py --log-dir .update-agent

      - name: Check repair
        if: >-
          always() && steps.packages.outcome == 'success' &&
          hashFiles('.update-agent/failures.json') != '' &&
          hashFiles('.update-agent/gate') == ''
        run: |
          trap 'echo repair > .update-agent/gate' ERR
          set -euo pipefail
          gate=ok
          if [ ! -f .update-agent/report.json ] ||
            [ "$(jq -r '.agent.ran' .update-agent/report.json)" != "true" ] ||
            [ "$(jq '.unresolved | length' .update-agent/report.json)" -gt 0 ]; then
            gate=repair
          fi
          outside=$(git status --porcelain -- . \
            ':(exclude)modules/packages' ':(exclude).update-agent' \
            ':(exclude).ci' ':(exclude).review')
          if [ -n "$outside" ]; then
            echo "::error::the repair agent changed files outside modules/packages"
            printf '%s\n' "$outside"
            gate=outside
          fi
          if [ "$gate" != ok ]; then
            echo "$gate" > .update-agent/gate
          fi

      # 4. Rebuild every updated package from the final working tree. This is
      # the build gate the review reads.
      - name: Build all updated packages
        id: final-build
        if: >-
          always() && steps.packages.outcome == 'success' &&
          hashFiles('.update-agent/failures.json') != '' &&
          hashFiles('.update-agent/gate') == ''
        continue-on-error: true
        run: |
          python3 scripts/verify-packages.py \
            --updates .update-agent/updates.json \
            --log-dir .ci

      - name: Check final build
        if: always() && steps.final-build.outcome == 'failure'
        run: echo build > .update-agent/gate

      - name: Detect repair changes
        id: changes
        if: >-
          always() && steps.packages.outcome == 'success' &&
          hashFiles('.update-agent/failures.json') != '' &&
          hashFiles('.update-agent/gate') == ''
        run: |
          if [ -n "$(git status --porcelain -- modules/packages)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record repair diff
        if: steps.changes.outputs.changed == 'true'
        run: |
          { git diff HEAD --binary; git status --porcelain --untracked-files=all; } |
            sha256sum | cut -d' ' -f1 > .update-agent/repair.sha

      # 5. A second, independent agent reviews the repair before the repair
      # commit is created. Any security finding blocks the commit.
      - name: Review repairs
        id: review
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          OMP_REVIEW_MODEL: ${{ vars.OMP_REVIEW_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 scripts/review-updates.py \
            --base "$(cat .update-agent/clean-tip)" \
            --log-dir .review

      - name: Check review
        if: always() && steps.changes.outputs.changed == 'true'
        run: |
          trap 'echo review > .update-agent/gate' ERR
          set -euo pipefail
          gate=ok
          if [ "${{ steps.review.outcome }}" != "success" ] ||
            [ ! -f .review/verdict.json ] ||
            [ "$(jq -r '.approve' .review/verdict.json)" != "true" ] ||
            [ "$(jq '.security_findings // [] | length' .review/verdict.json)" -ne 0 ]; then
            gate=review
          fi
          outside=$(git status --porcelain -- . \
            ':(exclude)modules/packages' ':(exclude).update-agent' \
            ':(exclude).ci' ':(exclude).review')
          if [ -n "$outside" ]; then
            echo "::error::the review agent changed files outside modules/packages"
            printf '%s\n' "$outside"
            gate=review
          fi
          after=$(
            { git diff HEAD --binary; git status --porcelain --untracked-files=all; } |
              sha256sum | cut -d' ' -f1
          )
          if [ "$after" != "$(cat .update-agent/repair.sha)" ]; then
            echo "::error::the review agent changed the working tree"
            gate=review
          fi
          if [ "$gate" != ok ]; then
            echo "$gate" > .update-agent/gate
          fi

      - name: Commit repairs
        id: commit-repairs
        if: >-
          always() && steps.changes.outputs.changed == 'true' &&
          hashFiles('.update-agent/gate') == ''
        continue-on-error: true
        run: |
          python3 scripts/commit-updates.py --phase repair \
            --report .update-agent/updates.json

      - name: Check repair commit
        if: always() && steps.commit-repairs.outcome == 'failure'
        run: echo repair > .update-agent/gate

      - name: Mark verified
        if: >-
          always() && steps.packages.outcome == 'success' &&
          hashFiles('.update-agent/failures.json') != '' &&
          hashFiles('.update-agent/gate') == ''
        run: touch .update-agent/ok

      # 6. Publish. Without the ok marker, reset to clean-tip: the failed pins
      # and repairs are dropped, but the clean update commits still land.
      - name: Push updates
        id: push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .update-agent/clean-tip ]; then
            echo "::error::the update did not reach the commit phase"
            exit 1
          fi

          clean_tip=$(cat .update-agent/clean-tip)
          if [ ! -f .update-agent/ok ]; then
            gate=$(cat .update-agent/gate 2>/dev/null || echo unverified)
            echo "::error::verification did not finish ($gate); dropping unverified pins"
            git reset --hard "$clean_tip"
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to push"
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          if [ ! -f .update-agent/ok ]; then
            exit 1
          fi

      # A push made with GITHUB_TOKEN does not trigger a `push` workflow.
      # Dispatch the deploy for the revision that was just pushed.
      - name: Dispatch deployment
        if: always() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Upload update artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-agent
          path: |
            .update-agent/
            .ci/
            .review/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Report
        if: always()
        run: |
          {
            echo "## Package update"
            echo
            if [ -f .update-agent/updates.json ]; then
              jq -r '.[] | "- \(.label): \(.old) -> \(.new)\(if .failed then " (repair)" else "" end)"' \
                .update-agent/updates.json
            else
              echo "No package changed."
            fi
            if [ -f .update-agent/report-body.md ]; then
              echo
              cat .update-agent/report-body.md
            fi
            if [ -f .review/review.md ]; then
              echo
              cat .review/review.md
            fi
            if [ -f .update-agent/gate ]; then
              echo
              echo "Gate: **$(cat .update-agent/gate)**. Unverified pins were dropped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
