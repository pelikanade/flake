keys:
  - &noa age155rf8ggpnmdmcpwkd4gj3qy8j05wdtz7cwf96k50um6xly40h3wqc8pthy
  - &neko-sphere age1fca2dlmqukt48zg89lrd0k2s5q8w52f9z3tyrfzcr2r2sj8gegxssldpzp
  - &asymmetry age1r6yhequnuznq8chh6l6zq4mwdmf3htcffsxndg4r542qffuj4chsdzlgws
  - &parallax age12najdl7c469qu0txpft0gvqv9ng59t2u99m5mkmgy79k3hdg3pjsy4748z
creation_rules:
  # A host appears only in the rule for a document its activation reads, because
  # a recipient decrypts the whole document. Every consumer, Home Manager
  # programs included, reads a NixOS-provisioned file, so each document lists
  # just the hosts that decrypt it, plus the maintainer where it must stay
  # editable. sops applies the first matching rule, so keep the patterns
  # disjoint; there is no catch-all, and a document that matches no rule cannot
  # be encrypted until one names exactly who decrypts it.
  # Every host that runs sing-box reads the proxy credentials and endpoints, and
  # the maintainer keeps the document editable.
  - path_regex: ^modules/secrets/sing-box\.yaml$
    key_groups:
      - age:
          - *noa
          - *asymmetry
          - *neko-sphere
          - *parallax
  # The tailnet belongs to the host rather than to sing-box: every host that
  # joins it reads this key through the `tailscale` module, which is the only
  # consumer. The maintainer keeps the document editable.
  - path_regex: ^modules/secrets/tailscale\.yaml$
    key_groups:
      - age:
          - *noa
          - *asymmetry
          - *neko-sphere
          - *parallax
  # Magpie's endpoint, browser UI sign-in key and gateway API key. The gateway
  # and Paseo on neko-sphere, plus omp on both desktops, read this document.
  - path_regex: ^modules/secrets/magpie\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
          - *asymmetry
          - *parallax
  # The Paseo daemon password, read only by neko-sphere's daemon. The maintainer
  # keeps the document editable.
  - path_regex: ^modules/secrets/paseo\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
  # The Cloudflare API token that lets neko-sphere's ingress answer the ACME
  # DNS-01 challenge for its wildcard certificate. Only that host's Caddy reads
  # it; the maintainer keeps the document editable.
  - path_regex: ^modules/secrets/ingress\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
  # The NetBird endpoint and setup key of the userspace client. neko-sphere is
  # the only host that runs it, so it is the only host that reads the document;
  # the maintainer keeps it editable.
  - path_regex: ^modules/secrets/netbird-userspace\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
