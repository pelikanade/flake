keys:
  - &noa age155rf8ggpnmdmcpwkd4gj3qy8j05wdtz7cwf96k50um6xly40h3wqc8pthy
  - &neko-sphere age1fca2dlmqukt48zg89lrd0k2s5q8w52f9z3tyrfzcr2r2sj8gegxssldpzp
  - &asymmetry age1r6yhequnuznq8chh6l6zq4mwdmf3htcffsxndg4r542qffuj4chsdzlgws
  - &parallax age12najdl7c469qu0txpft0gvqv9ng59t2u99m5mkmgy79k3hdg3pjsy4748z
  - &edge age1nu4amp388373487w6gadw9px4ldfddlgfnk4t4t6g27ntf3c9udqy8ds6n
  # The phone's identity is its SSH host key, which NixOS generates into the
  # root filesystem, so a full flash of the device produces a new one.
  - &alioth age1m88lf2h2uhdqmy88waefyrr06h7e686s9mgsc6daflmy7h79fsjqfpajg5
creation_rules:
  # sops applies the first matching rule, so keep the patterns disjoint; there is
  # no catch-all, and a document that matches no rule cannot be encrypted until
  # one names exactly who decrypts it.
  - path_regex: ^modules/secrets/sing-box\.yaml$
    key_groups:
      - age:
          - *noa
          - *asymmetry
          - *neko-sphere
          - *parallax
  - path_regex: ^modules/secrets/tailscale\.yaml$
    key_groups:
      - age:
          - *noa
          - *asymmetry
          - *neko-sphere
          - *parallax
          - *edge
          - *alioth
  - path_regex: ^modules/secrets/magpie\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
          - *asymmetry
          - *parallax
          - *edge
  - path_regex: ^modules/secrets/freezer\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
  - path_regex: ^modules/secrets/paseo\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
  - path_regex: ^modules/secrets/netbird-userspace\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
  - path_regex: ^modules/secrets/beszel\.yaml$
    key_groups:
      - age:
          - *noa
          - *edge
          - *neko-sphere
  - path_regex: ^modules/secrets/avalanche\.yaml$
    key_groups:
      - age:
          - *noa
          - *neko-sphere
          - *edge
  - path_regex: ^modules/secrets/alioth-wifi\.yaml$
    key_groups:
      - age:
          - *noa
          - *alioth
