[widget.brightness]
capsule = true

[widget.launcher]
glyph = "noctalia"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.sysmon]
stat = "swap_pct"

[widget.taskbar]
focused_output_only = true
group_by_workspace = true
show_all_outputs = true

[widget.volume]
capsule = false
capsule_padding = 12

[widget.wallhaven_2]
type = "noctalia/wallhaven:wallhaven"